<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>No access</title>
  <style>
    :root { color-scheme: light dark; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px;
      font: 18px/1.55 system-ui, -apple-system, "Segoe UI", sans-serif;
      background: #fffbf8; color: #12105e; }
    main { max-width: 30em; text-align: center; }
    h1 { margin: 0 0 12px; font-size: 32px; }
    p { margin: 0 0 24px; color: #4b4a8f; }
    a { display: inline-block; padding: 14px 28px; border-radius: 999px; background: #6965db;
      color: #fff; font-weight: 600; text-decoration: none; }
    @media (prefers-color-scheme: dark) {
      body { background: #12111c; color: #efedff; } p { color: #aaa8d8; }
    }
  </style>
</head>
<body>
  <main>
    <h1>You're signed in, but not on the access list</h1>
    <p>This workspace is limited to invited accounts. Ask the owner for an invite link, then sign in again with the account it was made for.</p>
    <a href="/.auth/logout?post_logout_redirect_uri=/">Sign in with a different account</a>
  </main>
</body>
</html>
